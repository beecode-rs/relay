name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELAY_ANDROID_STORE_FILE: upload.jks
      RELAY_ANDROID_STORE_PASSWORD: ${{ secrets.RELAY_ANDROID_STORE_PASSWORD }}
      RELAY_ANDROID_KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
      RELAY_ANDROID_KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert tag matches app.json and package.json versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="v$(node -p "require('./app.json').expo.version")"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$APP_VERSION" != "${GITHUB_REF_NAME}" ] || [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${APP_VERSION} / package.json version ${PKG_VERSION}"
            exit 1
          fi
      - run: pnpm exec expo prebuild -p android --no-install
      - run: node scripts/patch-android-build.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
      - run: node scripts/patch-android-release-signing.mjs
      - run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
        working-directory: android
      - name: Stage artifact
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Relay-v${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  build-ios:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert tag matches app.json and package.json versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="v$(node -p "require('./app.json').expo.version")"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$APP_VERSION" != "${GITHUB_REF_NAME}" ] || [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${APP_VERSION} / package.json version ${PKG_VERSION}"
            exit 1
          fi
      - run: pnpm exec expo prebuild -p ios
      - name: Build unsigned release archive
        run: >
          xcodebuild -workspace ios/Relay.xcworkspace -scheme Relay
          -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          build
      - name: Package unsigned IPA
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Relay.app Payload/
          zip -qry "dist/Relay-v${VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
